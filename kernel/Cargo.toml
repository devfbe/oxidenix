[package]
name = "oxidenix"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "oxidenix"
test = false
bench = false

[dependencies]
bootloader_api = "0.11"
x86_64 = "0.15"
pic8259 = "0.10"
pc-keyboard = "0.7"
spin = "0.9"
heapless = "0.9"
fsproto = { path = "../crates/fsproto" }
netproto = { path = "../crates/netproto" }
procproto = { path = "../crates/procproto" }
restricted = { path = "../crates/restricted" }
vfs = { path = "../crates/vfs" }
ring = { path = "../crates/ring" }
noto-sans-mono-bitmap = { version = "0.2", features = ["size_24", "unicode-latin-1-supplement", "unicode-specials"] }
linked_list_allocator = "0.10"
slab = { path = "../crates/slab" }
lazy_static = { version = "1.0", features = ["spin_no_std"] }

[build-dependencies]
png = "0.18"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
