<svg xmlns="http://www.w3.org/2000/svg" width="560" height="156" viewBox="0 0 560 156">
  <!-- oxidenix boot logo. Rendered to logo.png, which the kernel embeds:
       nix shell nixpkgs#imagemagick -c magick -background none logo.svg -depth 8 logo.png -->
  <defs>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.55" stop-color="#e8641b"/>
      <stop offset="1" stop-color="#a8320f"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a12"/>
      <stop offset="1" stop-color="#120a06"/>
    </linearGradient>
  </defs>
  <!-- Emblem: an oxide crystal (hexagon) with a microkernel core and four servers. -->
  <g transform="translate(78 78)">
    <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35" fill="url(#rust)"/>
    <polygon points="0,-56 48.5,-28 48.5,28 0,56 -48.5,28 -48.5,-28" fill="url(#core)"/>
    <g stroke="#e8641b" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="0" x2="-26" y2="-26"/>
      <line x1="0" y1="0" x2="26" y2="-26"/>
      <line x1="0" y1="0" x2="-26" y2="26"/>
      <line x1="0" y1="0" x2="26" y2="26"/>
    </g>
    <circle r="15" fill="url(#rust)"/>
    <circle cx="-28" cy="-28" r="7" fill="#ffb347"/>
    <circle cx="28" cy="-28" r="7" fill="#ffb347"/>
    <circle cx="-28" cy="28" r="7" fill="#ffb347"/>
    <circle cx="28" cy="28" r="7" fill="#ffb347"/>
  </g>
  <!-- Word mark -->
  <text x="168" y="92" font-family="DejaVu Sans" font-weight="bold" font-size="66" letter-spacing="-1">
    <tspan fill="url(#rust)">oxide</tspan><tspan fill="#e6e6e6">nix</tspan>
  </text>
  <text x="172" y="126" font-family="DejaVu Sans Mono" font-size="17" fill="#9a9a9a">a microkernel in Rust, built with AI</text>
</svg>
