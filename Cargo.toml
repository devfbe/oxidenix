[workspace]
members = ["kernel", "builder", "crates/ext2fs", "crates/oxrt", "crates/procproto", "crates/virtio", "crates/restricted", "crates/vfs", "crates/slab", "crates/pageheap", "crates/ring", "crates/fsring", "crates/netlink", "crates/netring", "crates/linkring","crates/ldisc", "crates/kbd","crates/csprng", "crates/clockpage", "crates/elfcore", "servers/linux", "servers/diskfs", "servers/netd", "servers/procfs", "servers/ringtest"]
resolver = "2"
# Vendored crates are workspaces of their own (their tests run there).
exclude = ["third_party"]

[profile.dev]
panic = "abort"
# Unoptimized page-table code made fork/exec ~10x slower; keep debug info.
opt-level = 2

[profile.release]
panic = "abort"
# Symbols and line tables stay in target/ (a server's panic backtrace is
# resolved with them: CLAUDE.md); userspace/build.sh strips the copies
# that ship in the initramfs, which the bootloader reads slowly.
debug = "line-tables-only"
