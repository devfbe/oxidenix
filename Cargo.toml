[workspace]
members = ["kernel", "builder", "crates/fsproto", "crates/ext2fs", "crates/oxrt", "crates/procproto", "crates/virtio", "crates/restricted", "crates/vfs", "crates/slab", "crates/ring", "crates/fsring", "crates/netlink", "crates/netring", "crates/ldisc", "servers/linux", "servers/diskfs", "servers/netd", "servers/procfs", "servers/ringtest"]
resolver = "2"

[profile.dev]
panic = "abort"
# Unoptimized page-table code made fork/exec ~10x slower; keep debug info.
opt-level = 2

[profile.release]
panic = "abort"
# Servers ship in the initramfs, which the bootloader reads slowly.
strip = "symbols"
