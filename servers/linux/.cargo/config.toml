[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[build]
target = "x86_64-unknown-none"
# An ET_EXEC binary linked into the shared region at 64 TiB (see
# crates/restricted): position-independent code, since the small code
# model's absolute addresses only reach the lowest 2 GiB. The target has no
# SSE, which keeps the program's FPU state intact while the server runs.
rustflags = ["-C", "relocation-model=pic", "-C", "link-arg=--no-pie", "-C", "link-arg=--image-base=0x400000000000"]
