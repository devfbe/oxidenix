[package]
name = "netd"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "netd"
test = false
bench = false

[dependencies]
oxrt = { path = "../../crates/oxrt" }
virtio = { path = "../../crates/virtio" }
netring = { path = "../../crates/netring" }
ring = { path = "../../crates/ring" }
# smoltcp 0.14 with netd's patches (third_party/smoltcp/Cargo.toml lists them).
smoltcp = { path = "../../third_party/smoltcp", default-features = false, features = [
    "alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-dhcpv4", "socket-raw", "auto-icmp-echo-reply",
] }
