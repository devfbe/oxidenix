name: test

on:
  push:
  pull_request:

jobs:
  qemu:
    name: self-tests in QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Boot oxidenix and run the self-tests
        working-directory: kernel
        shell: bash
        run: |
          # QEMU exits with 1 when every test passed and 3 when one failed.
          set +e
          OXIDENIX_TEST=1 timeout 3600 cargo run < /dev/null 2>&1 | tee ../qemu.log
          code=${PIPESTATUS[0]}
          set -e
          echo "QEMU exit code: $code"
          test "$code" -eq 1

      - name: Check the ext2 disk written by oxidenix
        run: nix-shell -p e2fsprogs --run "e2fsck -fn disk.img"

      - name: Upload the serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-log
          path: qemu.log
