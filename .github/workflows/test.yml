name: test

on:
  push:
  pull_request:

jobs:
  qemu:
    name: self-tests in QEMU (${{ matrix.firmware }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        firmware: [uefi, bios]
    env:
      OXIDENIX_FIRMWARE: ${{ matrix.firmware }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          # The pinned nixpkgs: the same packages as a local build.
          nix_path: nixpkgs=${{ github.workspace }}/nix/nixpkgs.nix

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      # The runners have KVM, but /dev/kvm is not accessible by default.
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup show

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Check that the code map is current
        if: matrix.firmware == 'uefi'
        run: python3 scripts/codemap.py --check

      - name: Test the ext2 library on the host
        if: matrix.firmware == 'uefi'
        run: nix-shell -p e2fsprogs --run "cargo test -p ext2fs"

      - name: Test the Linux server's namespace library on the host
        if: matrix.firmware == 'uefi'
        run: cargo test -p vfs

      - name: Test the size-class allocator on the host
        if: matrix.firmware == 'uefi'
        run: cargo test -p slab

      - name: Test the I/O ring on the host
        if: matrix.firmware == 'uefi'
        run: cargo test --release -p ring

      - name: Test the file protocol over the rings on the host
        if: matrix.firmware == 'uefi'
        run: cargo test -p fsring

      - name: Test rtnetlink's messages on the host
        if: matrix.firmware == 'uefi'
        run: cargo test -p netlink

      - name: Test the socket protocol between the Linux server and netd on the host
        if: matrix.firmware == 'uefi'
        run: cargo test --release -p netring

      - name: Test the terminals' line discipline on the host
        if: matrix.firmware == 'uefi'
        run: cargo test -p ldisc

      - name: Test the random generator and keyed hash against their vectors on the host
        if: matrix.firmware == 'uefi'
        run: cargo test -p csprng

      - name: Test netd's patched smoltcp on the host
        if: matrix.firmware == 'uefi'
        run: cargo test --manifest-path third_party/smoltcp/Cargo.toml --lib

      - name: Boot oxidenix and run the self-tests
        working-directory: kernel
        shell: bash
        run: |
          # QEMU exits with 1 when every test passed and 3 when one failed.
          set +e
          OXIDENIX_TEST=1 timeout 3600 cargo run < /dev/null 2>&1 | tee ../qemu.log
          code=${PIPESTATUS[0]}
          set -e
          echo "QEMU exit code: $code"
          test "$code" -eq 1

      - name: Check the ext2 disk written by oxidenix
        run: nix-shell -p e2fsprogs --run "e2fsck -fn target/test-disk.img"

      - name: Upload the serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-log-${{ matrix.firmware }}
          path: qemu.log
